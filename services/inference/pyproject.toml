[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oralsight-inference"
version = "0.1.0"
description = "Stateless, non-diagnostic image analysis service for the OralSight research prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.139.2",
  "numpy==2.5.1",
  "opencv-python-headless==4.13.0.92",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
oralsight-evaluate-repeat-capture = "oralsight_api.comparison_evaluation:main"

[tool.vercel]
entrypoint = "vercel_entrypoint:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oralsight_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["oralsight_api"]
