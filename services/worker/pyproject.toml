[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oralsight-worker"
version = "0.1.0"
description = "Durable, privacy-preserving asynchronous job worker for OralSight"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11.1,<13",
  "pydantic==2.13.4",
  "pydantic-settings>=2.12,<3",
  "redis>=5.2,<8",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff==0.14.14",
]

[project.scripts]
oralsight-worker = "oralsight_worker.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/oralsight_worker"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["oralsight_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]
