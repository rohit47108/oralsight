[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stoma3d-ml"
version = "0.1.0"
description = "Fail-closed research evaluation and training utilities for Stoma3D"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary research prototype; see repository license inventory" }
authors = [{ name = "Stoma3D student team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]
research = [
  "dvc>=3.59,<4",
  "mlflow>=3.1,<4",
  "onnx>=1.18,<2",
  "openpyxl>=3.1,<4",
  "pillow>=11.2,<13",
  "segmentation-models-pytorch>=0.5,<0.6",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]

[project.scripts]
stoma3d-validate-manifest = "stoma3d_ml.manifest:main"
stoma3d-evaluate-gates = "stoma3d_ml.gates:main"
stoma3d-subgroup-report = "stoma3d_ml.subgroups:main"
stoma3d-model-card = "stoma3d_ml.model_card:main"
stoma3d-train-baseline = "stoma3d_ml.train:main"
stoma3d-train-release = "stoma3d_ml.release_training:main"
stoma3d-train-reidentification-release = "stoma3d_ml.reidentification_release:main"
stoma3d-segmentation-soup = "stoma3d_ml.segmentation_soup:main"
stoma3d-prepare-smart-om = "stoma3d_ml.smart_om:main"
stoma3d-prepare-autooral = "stoma3d_ml.autooral:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stoma3d_ml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
