stages:
  validate_manifest:
    cmd: python -m stoma3d_ml.manifest manifests/dataset.csv --require-audited
    deps:
      - manifests/dataset.csv
      - src/stoma3d_ml/manifest.py

# Training stages are added only after an audited manifest is copied to
# manifests/dataset.csv and its controlled data root is configured locally. Medical
# images and restricted labels must not be committed or uploaded as CI artifacts.

