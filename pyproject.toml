[project]
name = "oralsight-workspace"
version = "0.1.0"
description = "Python workspace for OralSight inference and research evaluation"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["services/inference", "services/platform-api", "services/worker", "ml"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
