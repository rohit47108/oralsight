name: stoma3d

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: stoma3d
      POSTGRES_USER: stoma3d
      POSTGRES_PASSWORD: ${STOMA3D_LOCAL_POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - stoma3d-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoma3d -d stoma3d"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7.4.3-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - stoma3d-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  inference:
    build:
      context: ./services/inference
    image: stoma3d-inference:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STOMA3D_DEPLOYMENT_MODE: development
      STOMA3D_ENABLE_DEMO_FIXTURES: "false"
      STOMA3D_REQUIRE_RESPONSE_SIGNING: "true"
      # Public, deterministic local-development key. Never use it outside this stack.
      STOMA3D_RESPONSE_SIGNING_PRIVATE_KEY_B64: ${STOMA3D_LOCAL_RESPONSE_SIGNING_PRIVATE_KEY_B64:-QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=}
      STOMA3D_RESPONSE_SIGNING_KEY_ID: ${STOMA3D_LOCAL_RESPONSE_SIGNING_KEY_ID:-3097e2dee2cb4a34}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  platform-migrate:
    build:
      context: ./services/platform-api
    image: stoma3d-platform-api:local
    command: ["alembic", "upgrade", "head"]
    environment: &platform-environment
      STOMA3D_PLATFORM_DATABASE_URL: postgresql+asyncpg://stoma3d:${STOMA3D_LOCAL_POSTGRES_PASSWORD:-local-development-only}@postgres:5432/stoma3d
      STOMA3D_PLATFORM_ENVIRONMENT: development
      STOMA3D_PLATFORM_CREATE_SCHEMA_ON_START: "false"
      STOMA3D_PLATFORM_AUTH_MODE: local_test
      STOMA3D_PLATFORM_OIDC_AUDIENCE: stoma3d-platform-api
      STOMA3D_PLATFORM_LOCAL_TEST_ISSUER_URL: https://stoma3d.local.test
      STOMA3D_PLATFORM_LOCAL_TEST_SIGNING_SECRET: ${STOMA3D_LOCAL_SIGNING_SECRET:-local-development-signing-secret-change-me}
      STOMA3D_PLATFORM_SHARE_SECRET_DERIVATION_KEY: ${STOMA3D_LOCAL_SHARE_SECRET:-local-development-share-secret-change-me-32-bytes}
      STOMA3D_PLATFORM_WORKER_SERVICE_HMAC_SECRET: ${STOMA3D_LOCAL_SERVICE_HMAC_SECRET:-local-development-worker-hmac-secret-change-me}
      STOMA3D_PLATFORM_OBJECT_STORAGE_BACKEND: local
      STOMA3D_PLATFORM_OBJECT_STORAGE_ROOT: /var/lib/stoma3d-assets
      STOMA3D_PLATFORM_OBJECT_STORAGE_PUBLIC_BASE_URL: http://127.0.0.1:8001
      STOMA3D_PLATFORM_QUEUE_BACKEND: redis
      STOMA3D_PLATFORM_REDIS_URL: redis://redis:6379/0
      STOMA3D_PLATFORM_REDIS_STREAM_NAME: stoma3d:jobs:v1
      STOMA3D_PLATFORM_REDIS_CANCEL_PREFIX: "stoma3d:job-cancelled:v1:"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-storage-init:
    image: stoma3d-platform-api:local
    user: "0:0"
    command: ["chown", "-R", "stoma3d:stoma3d", "/var/lib/stoma3d-assets"]
    volumes:
      - stoma3d-assets:/var/lib/stoma3d-assets
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"

  platform-api:
    image: stoma3d-platform-api:local
    environment: *platform-environment
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      platform-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - stoma3d-assets:/var/lib/stoma3d-assets
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  worker:
    build:
      context: ./services/worker
    image: stoma3d-worker:local
    environment:
      STOMA3D_WORKER_ENVIRONMENT: development
      STOMA3D_WORKER_CONSUMER_NAME: worker-compose-1
      STOMA3D_WORKER_REDIS_URL: redis://redis:6379/0
      STOMA3D_WORKER_HEALTH_PORT: "8010"
      STOMA3D_WORKER_PLATFORM_API_URL: http://platform-api:8080
      STOMA3D_WORKER_INFERENCE_API_URL: http://inference:8000
      # Public half matching the local-development inference key above.
      STOMA3D_WORKER_INFERENCE_RESPONSE_SIGNING_PUBLIC_KEY_B64: ${STOMA3D_LOCAL_RESPONSE_SIGNING_PUBLIC_KEY_B64:-IVL40Zt5HSRFMkLhXy6rbLfP+ntqXtMAl5YOBpiB2xI=}
      STOMA3D_WORKER_SERVICE_ID: stoma3d-worker
      STOMA3D_WORKER_SERVICE_HMAC_SECRET: ${STOMA3D_LOCAL_SERVICE_HMAC_SECRET:-local-development-worker-hmac-secret-change-me}
      STOMA3D_WORKER_CONCURRENCY: "2"
    depends_on:
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8010"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  stoma3d-postgres:
  stoma3d-redis:
  stoma3d-assets:
